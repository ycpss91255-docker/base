# .env.toml -- service runtime environment defaults.
#
# Per ADR-00000037, this file owns how the APPLICATION INSIDE the
# container behaves: ROS parameters, log levels, feature flags,
# application-level knobs. Docker infrastructure (how the container
# is built and run) belongs in setup.toml, not here.
#
# Override layering (three files, lowest precedence first):
#   1. Template default: .base/dist/.env.toml
#   2. Per-repo override: <repo>/.env.toml (committed)
#   3. Per-instance override: <repo>/.env.local.toml (gitignored)
#
# Merge semantics: key-level merge within [environment] (upper layer
# overrides only the keys it defines).

# ═════════════════════════════════════════════════════════════════════
# [environment] -- service runtime env vars
# ═════════════════════════════════════════════════════════════════════
# Application-level parameters the container's service reads.
# These are NOT host interfaces (DISPLAY, NVIDIA_* belong in
# setup.toml [environment]).
[environment]
# ROS_MASTER_URI = "http://localhost:11311"
# ROS_DOMAIN_ID = "0"
# LOG_LEVEL = "info"
# WATCHDOG_ENABLED = "false"
