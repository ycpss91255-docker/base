# setup.toml -- source of truth for Docker infrastructure config.
#
# TOML replacement for .setup.conf (ADR-37). Parsed by the
# toml-bridge container; generated outputs (compose.yaml, .env) are
# unchanged. Edit this file, then re-run a build / run wrapper
# (or `just setup`) to regenerate artifacts.
#
# Override layering (lowest precedence first):
#   1. Template default: <template>/setup.toml
#   2. Per-repo override: <repo>/setup.toml (committed)
#   3. Per-worktree override: <repo>/setup.local.toml (gitignored)
#
# Merge semantics (ADR-37 D4):
#   - Scalar keys within a [table]: key-level merge (upper overrides
#     only the keys it defines; unmentioned keys inherit).
#   - [[array of tables]]: array replace (upper replaces entire array).


[project]
name = ""


# IMAGE_NAME detection rules (tried in order).
# Each rule is a string with a mini-syntax:
#   prefix:<str>  -- strip prefix from directory name
#   suffix:<str>  -- strip suffix from directory name
#   @basename     -- use directory basename as-is
[[image.rules]]
rule = "prefix:docker_"

[[image.rules]]
rule = "suffix:_ws"

[[image.rules]]
rule = "@basename"


[build]
target_arch = ""
network = "auto"

[[build.args]]
key = "APT_MIRROR_UBUNTU"
value = "tw.archive.ubuntu.com"

[[build.args]]
key = "APT_MIRROR_DEBIAN"
value = "mirror.twds.com.tw"

[[build.args]]
key = "TZ"
value = "Asia/Taipei"


[deploy]
gpu_mode = "auto"
gpu_count = "all"
gpu_capabilities = "gpu compute utility graphics"
gpu_runtime = "auto"
dri_groups = "auto"


[lifecycle]
restart = "unless-stopped"
init = true
# watchdog_check = ""
# watchdog_interval = 30
# watchdog_timeout = 10
# watchdog_start_period = 0
# watchdog_failures = 3
# watchdog_on_fail = "restart-container"
# watchdog_max_restarts = 5
# watchdog_notify = ""


[gui]
mode = "auto"


[network]
mode = "host"
ipc = "host"
pid = "private"
network_name = ""
# Ports: add [[network.ports]] entries after switching to bridge mode.
# [[network.ports]]
# host = "8080"
# container = "80"


[security]
privileged = false
# Capabilities and security options: add as needed.
# [[security.cap_add]]
# name = "SYS_ADMIN"
#
# [[security.security_opt]]
# name = "seccomp:unconfined"


[resources]
shm_size = ""


# Infrastructure env only (host interfaces the container needs to
# function). Service runtime env goes in .env.toml (ADR-37 D8).
[environment]


# RAM-backed mount points.
# [[tmpfs]]
# path = "/tmp"
#
# [[tmpfs]]
# path = "/tmp/cache:size=1g"


# Host device bindings.
# [[devices]]
# path = "/dev/video0"


# Workspace mount + extras.
# [[volumes]]
# source = "./src"
# target = "/opt/workspace"
# mode = "rw"


# Extra named build contexts.
# [[additional_contexts]]
# name = "base-tools"
# source = "docker-image://base-tools:latest"


[logging]
driver = "json-file"
max_size = "10m"
max_file = 3
compress = true
local_path = ""
container_log_keep = 20
container_log_days = 14
wrapper_transcript = true
wrapper_transcript_keep = 20
wrapper_transcript_days = 14
