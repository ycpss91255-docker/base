# setup.toml -- source of truth for Docker infrastructure configuration.
#
# TOML replacement for .setup.conf (INI format) per ADR-00000037.
#
# This file owns HOW the container is assembled and run: image rules,
# build args, GPU, GUI, network, volumes, devices, security, lifecycle,
# logging, deploy, additional contexts. Service runtime env vars
# (ROS_MASTER_URI, LOG_LEVEL, etc.) belong in .env.toml, not here.
#
# Override layering (three files, lowest precedence first):
#   1. Template default: .base/dist/setup.toml
#   2. Per-repo override: <repo>/setup.toml (committed)
#   3. Per-instance override: <repo>/setup.local.toml (gitignored)
#
# Merge semantics (ADR-37):
#   - Scalar keys within a [table]: key-level merge (upper overrides
#     only the keys it defines; unmentioned keys inherit).
#   - [[array of tables]]: array replace (if the upper layer defines
#     any entries, the entire array replaces the lower layer's).

# ═════════════════════════════════════════════════════════════════════
# [project] -- the compose project name
# ═════════════════════════════════════════════════════════════════════
# Ships empty = derive as before (<DOCKER_HUB_USER>-<IMAGE_NAME>).
# Set to run two worktrees of one repo at the same time. Put that
# value in the gitignored setup.local.toml, not here.
[project]
name = ""

# ═════════════════════════════════════════════════════════════════════
# [[image.rules]] -- IMAGE_NAME detection rules (tried in order)
# ═════════════════════════════════════════════════════════════════════
# Each entry is one rule tried in numeric order. The first match wins.
# Array-of-tables: an overlay defining any [[image.rules]] replaces
# the entire list.

[[image.rules]]
rule = "prefix:docker_"

[[image.rules]]
rule = "suffix:_ws"

[[image.rules]]
rule = "@basename"

# ═════════════════════════════════════════════════════════════════════
# [build] -- Dockerfile build args + arch + build network
# ═════════════════════════════════════════════════════════════════════
[build]
target_arch = ""
network = "auto"

# Build arguments: array-of-tables. An overlay defining any
# [[build.args]] replaces the entire list.
[[build.args]]
key = "APT_MIRROR_UBUNTU"
value = "tw.archive.ubuntu.com"

[[build.args]]
key = "APT_MIRROR_DEBIAN"
value = "mirror.twds.com.tw"

[[build.args]]
key = "TZ"
value = "Asia/Taipei"

# ═════════════════════════════════════════════════════════════════════
# [deploy] -- GPU reservation (compose.yaml deploy.resources)
# ═════════════════════════════════════════════════════════════════════
# dri_groups: which /dev/dri owning GIDs the container is granted via
# compose `group_add:` (the non-NVIDIA iGPU path; only applied when GUI
# resolves on).
#   "auto"     detect them from this host's /dev/dri
#   "off"      grant none
#   "44 104"   grant exactly these, space-separated
# The explicit list is the one to use when the build host and the target
# host number their render group differently.
[deploy]
gpu_mode = "auto"
gpu_count = "all"
gpu_capabilities = "gpu compute utility graphics"
gpu_runtime = "auto"
dri_groups = "auto"

# ═════════════════════════════════════════════════════════════════════
# [lifecycle] -- container lifecycle policy
# ═════════════════════════════════════════════════════════════════════
# restart: deploy-scoped (applies to deployable stages only, never
# to devel or *-test). init: PID 1 zombie reaper via docker-init.
# watchdog: health-check-driven supervised-restart; all knobs
# default OFF (watchdog_check empty = no watchdog).
[lifecycle]
restart = "unless-stopped"
init = true
# watchdog_check = ""
# watchdog_interval = 30
# watchdog_timeout = 10
# watchdog_start_period = 0
# watchdog_failures = 3
# watchdog_on_fail = "restart-container"
# watchdog_max_restarts = 5
# watchdog_notify = ""

# ═════════════════════════════════════════════════════════════════════
# [gui] -- GUI display support
# ═════════════════════════════════════════════════════════════════════
[gui]
mode = "auto"

# ═════════════════════════════════════════════════════════════════════
# [network] -- network mode, IPC, port mappings
# ═════════════════════════════════════════════════════════════════════
# mode defaults to host for cross-machine ROS compatibility.
#
# PRECEDENCE: mode decides. Both `network_name` and `[[network.ports]]`
# apply only under mode = "bridge", so with the shipped host default a
# network name is not joined and a port mapping is not published --
# `setup.sh set` and every emitter say so rather than dropping the value
# quietly. Set mode = "bridge" to use either.
#
# pid: "private" (docker's own default, emitted as no key at all),
# "host", or "container:<name>". ipc takes those three plus "shareable".
[network]
mode = "host"
ipc = "host"
pid = "private"
# Joined only under mode = "bridge" (see PRECEDENCE above).
network_name = ""

# Port mappings: array-of-tables. Only take effect once
# network.mode = "bridge". An overlay defining any [[network.ports]]
# replaces the entire list.
# [[network.ports]]
# host = 8080
# container = 80

# ═════════════════════════════════════════════════════════════════════
# [security] -- container privilege / capabilities / security_opt
# ═════════════════════════════════════════════════════════════════════
# Privileges are opt-in. Defaults are lean so lightweight repos
# stay clean. Per-stage overrides via [stage:<name>].
[security]
privileged = false

# Capabilities: three independent array-of-tables lists under this
# table. Each replaces on its own -- an overlay defining any
# [[security.cap_add]] replaces the whole cap_add list and leaves the
# drops and the opts alone, and the same each way round. All three are
# opt-in, so the template ships none of them.
# [[security.cap_add]]
# cap = "SYS_ADMIN"
#
# [[security.cap_add]]
# cap = "NET_ADMIN"
#
# [[security.cap_drop]]
# cap = "NET_RAW"
#
# [[security.security_opt]]
# opt = "seccomp:unconfined"

# ═════════════════════════════════════════════════════════════════════
# [resources] -- container resource limits (shm_size, etc.)
# ═════════════════════════════════════════════════════════════════════
# shm_size needs the container to have its own IPC namespace, so it is
# dropped while [network] ipc = "host" -- which is the shipped default.
# Set [network] ipc to "private" or "shareable" to use it; `setup.sh set`
# and every emitter report the drop rather than discarding the value
# quietly.
[resources]
shm_size = ""

# ═════════════════════════════════════════════════════════════════════
# [environment] -- infrastructure env (host interfaces)
# ═════════════════════════════════════════════════════════════════════
# Holds env vars that are HOST INTERFACES the container needs to
# function. These are infrastructure, not application behavior.
#
# Service runtime env vars (ROS_MASTER_URI, LOG_LEVEL, etc.) are not
# infrastructure and do not belong here. ADR-37 gives them .env.toml /
# .env.local.toml; until those readers land, the channel that acts is the
# gitignored .env.local, which takes effect with `just run` alone -- no
# regenerate, no drift, no git churn. Note the naming rule either way:
# .env is OURS, generated from this file and where the entries below land
# so the container receives them, and .env.local is YOURS and is never
# rewritten.
# TWO SPELLINGS, and only one of them is read today. The numbered form
# below is what `_resolve_docker_conf` collects
# (`_conf_list_sorted ... environment env_`), so it is the one that
# reaches the container. The direct-key form -- `DISPLAY = ""` as a key
# of this table -- is ADR-37's destination for this section and the
# readers for it have NOT landed (base#1235's env_N half); writing it
# here parses, and nothing emits it. Use the numbered form until that
# changes.
[environment]
# env_1 = "DISPLAY="
# env_2 = "NVIDIA_VISIBLE_DEVICES=all"
# env_3 = "PULSE_SERVER="
# env_4 = "WAYLAND_DISPLAY="
# env_5 = "XDG_RUNTIME_DIR="

# ═════════════════════════════════════════════════════════════════════
# [[tmpfs]] -- RAM-backed mount points
# ═════════════════════════════════════════════════════════════════════
# Array-of-tables. Each entry mounts a tmpfs at the given path.
# An overlay defining any [[tmpfs]] replaces the entire list.
# [[tmpfs]]
# path = "/tmp"
# size = "64m"

# ═════════════════════════════════════════════════════════════════════
# [devices] -- host device bindings + cgroup rules
# ═════════════════════════════════════════════════════════════════════
# Two independent array-of-tables lists under one namespace, the shape
# [security] uses for cap_add / security_opt. Each replaces on its own:
# an overlay defining any [[devices.bindings]] replaces the whole
# binding list and leaves the rules alone, and the reverse. Both are
# opt-in, so the template ships neither.
#
# [[devices.bindings]] -- compose `devices:`
# [[devices.bindings]]
# path = "/dev:/dev"
#
# [[devices.cgroup_rules]] -- compose `device_cgroup_rules:`
# [[devices.cgroup_rules]]
# rule = "c 189:* rwm"

# ═════════════════════════════════════════════════════════════════════
# [[volumes]] -- workspace mount + extras
# ═════════════════════════════════════════════════════════════════════
# Array-of-tables. Each entry specifies a bind mount.
# An overlay defining any [[volumes]] replaces the entire list.
# [[volumes]]
# source = "./src"
# target = "/opt/workspace"
# mode = "rw"

# ═════════════════════════════════════════════════════════════════════
# [[additional_contexts]] -- extra named build contexts
# ═════════════════════════════════════════════════════════════════════
# Array-of-tables. Each entry adds a named build context.
# An overlay defining any [[additional_contexts]] replaces the
# entire list.
# [[additional_contexts]]
# name = "context-name"
# source = "./path"

# ═════════════════════════════════════════════════════════════════════
# [logging] -- Docker logging driver + rotation + host file mount
# ═════════════════════════════════════════════════════════════════════
# Applied uniformly to every compose service. Optional per-service
# override is [logging.<service>] (key-level merge on top of
# [logging]).
#
# local_path: when non-empty, setup.sh emits a per-service host bind
# mount <resolved>:/var/log/<repo> so container stdout can be tee'd to
# a host-side file. The helper that performs the tee is shipped into
# every image at the stable in-image path
# /usr/local/lib/base/_entrypoint_logging.sh, and the repo's
# script/entrypoint.sh sources it with one unguarded line:
#   . /usr/local/lib/base/_entrypoint_logging.sh
# The helper is a no-op while LOG_FILE_PATH is unset, so that line is
# safe unconditionally. Path semantics for the value:
#   "./log/"      relative to the repo root
#   "/abs/path/"  absolute, used verbatim
#   "~/dir/"      ~ expanded to $HOME
#   ""            the feature is off
[logging]
driver = "json-file"
max_size = "10m"
max_file = 3
compress = true
local_path = ""
container_log_keep = 20
container_log_days = 14
wrapper_transcript = true
wrapper_transcript_keep = 20
wrapper_transcript_days = 14
