---
ignored:
  - DL3004  # Do not use sudo (dev container passwordless sudo is by design)
  # Pin versions in apt get install. Ignored deliberately, WITH a
  # compensating control -- an ignore that names nothing is what let the
  # shipped template lint clean while being non-reproducible.
  #
  # Why not pinned: BASE_IMAGE is chosen by the consumer (ubuntu / ros /
  # nvidia-cuda / python-slim ...), so one pinned version set cannot hold
  # across the bases this template is built on; and a development image
  # that cannot take a security update without a template release is worse
  # for its audience than one that drifts.
  #
  # What compensates: the drift is recorded, not silent. An image built
  # from the CURRENT dist/dockerfile/Dockerfile writes
  # /usr/local/share/base/packages.txt (every package and its exact
  # version, rewritten after each apt layer) and
  # /usr/local/share/base/base-image.env (the base reference, its digest
  # where one is known, and the base OS), so two divergent images can be
  # diffed down to the version that changed.
  #
  # Read this in a DOWNSTREAM repo: init.sh symlinks this file from
  # .base/dist/, and here it lints that repo's OWN, hand-edited
  # Dockerfile. So the compensating control above is a claim about the
  # TEMPLATE, not about the image you are building: a repo whose
  # Dockerfile predates this template revision has the ignore without the
  # record.
  #
  # `just upgrade` does not close that by itself, and not because it
  # cannot touch your Dockerfile -- it can: init.sh and upgrade.sh both
  # run apply_migrations from dist/script/docker/lib/dockerfile_migrate.sh
  # over a declarative list already populated for exactly this situation
  # (a base contract change downstream Dockerfiles must adopt). No
  # migration was written for THIS record, on purpose.
  # Every entry in that list rewrites a whole self-contained line (a COPY,
  # an ARG, a FROM) it can anchor on; the manifest instead splices into
  # the middle of the sys stage's backslash-continued `RUN ... && \`
  # chain, whose shape is the consumer's own, and a mis-spliced
  # continuation is a broken build rather than a missing record.
  #
  # So it is a hand port: `just upgrade`, then copy the two manifest
  # blocks -- the sys stage RUN and, if the runtime split is enabled,
  # runtime-base's -- from .base/dist/dockerfile/Dockerfile into your own.
  # `just build` followed by reading
  # /usr/local/share/base/base-image.env in the built image says which
  # side of that you are on.
  #
  # A consumer needing bit-for-bit builds pins BASE_IMAGE to a digest; see
  # the note above `ARG BASE_IMAGE` in dist/dockerfile/Dockerfile.
  - DL3008
  - DL3013  # Pin versions in pip install (downstream repo responsibility)
  - DL3018  # Pin versions in apk add (aligned with DL3008 strategy)
