services:
  # test-tools: base's own tooling image (ADR-00000011 sec.2/4).
  # `just docker build --target test-tools` builds it from the standalone
  # Dockerfile.test-tools via the shared docker wrapper, replacing the raw
  # `docker build -f` one-liner. build-only service: never `run`.
  #
  # The tag comes from the SAME `TEST_TOOLS_IMAGE` the ci / ci-system /
  # coverage services below read, so what this service writes and what they
  # consume cannot diverge -- a divergence there is silent (the consumers
  # would quietly pull the published image while the local build sat
  # unused). It used to be the fixed literal `test-tools:local`, which every
  # checkout on the host wrote: a sibling run rebuilding it displaced the
  # image a live run was already using, with no error (a coverage pass whose
  # image lost kcov mid-run still reported green). `just test system` now
  # sets TEST_TOOLS_IMAGE to a content hash of the tooling Dockerfile
  # (`./script/test/test.sh --test-tools-image`) -- identical inputs share a
  # tag and hit the build cache, different inputs cannot clobber. The
  # `test-tools:local` fallback below is what CI pins explicitly
  # (self-test.yaml) and stays for a bare `docker compose build test-tools`.
  test-tools:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.test-tools
    image: ${TEST_TOOLS_IMAGE:-test-tools:local}

  # Fast CI: ShellCheck + Bats only. Uses the prebuilt test-tools image
  # (alpine: bash + bats + bats-{support,assert,mock} + shellcheck +
  # hadolint baked in), so _install_deps short-circuits via its
  # `command -v bats` guard — no per-run apt-install.
  #
  # HOST_UID / HOST_GID are the uid:gid this service writes the mounted
  # checkout as, and they carry NO default: 1000 used to be substituted
  # when they were absent, so on any host whose developer is not uid 1000 a
  # bare compose run left files owned by a stranger and said nothing.
  # `just test` (test.sh) and `just test system` both put the real ids in
  # the environment compose interpolates; a path that reaches an unset
  # value has left that entry point, and the `:?` form refuses it by name.
  # TEST_TOOLS_IMAGE
  # can be overridden to pin a specific tag during local rebuild flows;
  # default :latest tracks the most recent template release tag because
  # release-test-tools.yaml rebuilds it on every v* push.
  ci:
    image: ${TEST_TOOLS_IMAGE:-ghcr.io/ycpss91255-docker/test-tools:latest}
    security_opt:
      - seccomp=unconfined
    volumes:
      - .:/source
    working_dir: /source
    environment:
      - HOST_UID=${HOST_UID:?set by 'just test' / 'just test system' -- run one of those instead of driving docker compose directly}
      - HOST_GID=${HOST_GID:?set by 'just test' / 'just test system' -- run one of those instead of driving docker compose directly}
    entrypoint: /bin/bash
    command:
      - -c
      - ./script/test/test.sh --ci

  # System: same image as `ci` but with the host docker
  # socket mounted so test/bats/system/*.bats can drive
  # `docker buildx build --target runtime-test ...` against synthesized
  # fixtures and assert build pass/fail. Opt-in: never invoked by the
  # default `just test` flow. Local users run via
  # `just test system`; CI runs via a dedicated
  # System Test job
  # in self-test.yaml. The dedicated buildx builder (template-system)
  # is created/pruned per test.sh --system run so this service does
  # NOT pollute the host's default buildx context or shared image cache.
  ci-system:
    image: ${TEST_TOOLS_IMAGE:-ghcr.io/ycpss91255-docker/test-tools:latest}
    security_opt:
      - seccomp=unconfined
    volumes:
      - .:/source
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path host mount for the field-deploy e2e (deploy_bundle_e2e_spec):
      # the generated deploy.sh runs `docker compose up` whose bind-mount
      # sources are resolved by the HOST daemon, not inside this container. A
      # bundle built under the container's private /tmp is invisible to the
      # host daemon (it would silently create an empty dir and fail the
      # file-over-baked-default mount). Mounting this path identically on host
      # and container makes the bundle's config binds resolve correctly.
      - /tmp/base-deploy-e2e:/tmp/base-deploy-e2e
    working_dir: /source
    environment:
      - HOST_UID=${HOST_UID:?set by 'just test' / 'just test system' -- run one of those instead of driving docker compose directly}
      - HOST_GID=${HOST_GID:?set by 'just test' / 'just test system' -- run one of those instead of driving docker compose directly}
      - MOUNT_DOCKER_SOCK=1
    entrypoint: /bin/bash
    command:
      - -c
      - ./script/test/test.sh --ci --system

  # Coverage: same pre-baked test-tools image as `ci`, plus kcov
  # instrumentation. kcov is now source-built INTO the test-tools
  # image (Dockerfile.test-tools kcov-builder stage; not in any Alpine
  # repo), so the coverage path runs on the same one-pull Alpine image as
  # the rest of the suite — no more debian kcov/kcov service, no per-shard
  # apt-install of ~24 packages (_install_deps), no APT_MIRROR_DEBIAN
  # fragility. The only difference from `ci` is COVERAGE=1, which routes
  # the in-container dispatch through _run_coverage.
  coverage:
    image: ${TEST_TOOLS_IMAGE:-ghcr.io/ycpss91255-docker/test-tools:latest}
    security_opt:
      - seccomp=unconfined
    volumes:
      - .:/source
    working_dir: /source
    environment:
      - HOST_UID=${HOST_UID:?set by 'just test' / 'just test system' -- run one of those instead of driving docker compose directly}
      - HOST_GID=${HOST_GID:?set by 'just test' / 'just test system' -- run one of those instead of driving docker compose directly}
    entrypoint: /bin/bash
    command:
      - -c
      - ./script/test/test.sh --ci
