# Division of labour with the upstream-release watch
# (.github/workflows/tool-version-watch.yaml).
#
# dependabot owns `uses:` VERSION refs -- tag refs and SHA pins on GitHub
# Actions -- and it does that job well here: 40+ call sites are current.
# It owns them EXCLUSIVELY. Giving one dependency two mechanisms with
# opinions is worse than one that works, so the watch's detector
# deliberately ignores a `uses:` version ref, and no `docker` ecosystem is
# declared below: that updater bumps Dockerfile `FROM` tags, which are
# exactly the pins the watch already reads out of their ARGs.
#
# The watch owns what dependabot provably cannot see or advance: a
# Dockerfile ARG, a `FROM` tag, an image named inside a `run:` step, a
# release-download URL, and a `uses:` ref pinned to a BRANCH (it bumps a
# version ref to the next VERSION, and `main` is not one). Every one of
# those carries a `tool-pin:` marker at its declaration site, and the
# `pin-coverage` lint fails a PR that adds one without a marker -- so the
# boundary cannot silently move by someone adding a pin on either side.
#
# One thing dependabot does that nothing else here can: it also stops. A
# CLOSED dependabot PR is never re-raised for that version pair, and no
# line in this file records the opt-out. The watch takes the opposite
# stance on purpose -- it re-proposes until the refusal is written down as
# `skip=<version>` on the marker.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
