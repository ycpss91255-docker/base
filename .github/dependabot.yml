# Dependabot configuration.
#
# ── Read this before closing a dependabot pull request ──────────────────
#
# Closing one is not deferring the bump. It is opting out of that version
# pair PERMANENTLY: dependabot never re-proposes a pair whose pull request
# was closed, for any call site the bump covered -- including call sites
# written long afterwards, which were never part of the decision.
#
# Nothing in this file records that. It stays correct and says nothing
# about which pairs have been dismissed, so the resulting blind spot is
# not discoverable by reading it; the only other way to see one is to go
# trawling the closed-pull-request history.
#
# That happened here. The docker/build-push-action v6 -> v7 pull request
# was closed, and five self-test.yaml call sites then sat on v6 while six
# elsewhere ran v7 -- two major versions of one action building images in
# one repository, green the whole time.
#
# So: to postpone a bump, leave the pull request OPEN, or re-raise it by
# hand later. To decline one, say so where the pin is, not by closing a
# pull request that leaves no trace in the tree.
#
# The `action-ref-agreement` lint (script/test/drivers/action_ref_agreement.sh,
# run per-PR by the lint-static CI job) is the backstop: it fails when one
# action is called at two refs across .github/workflows/, whatever
# dependabot does or does not remember.

# Division of labour with the upstream-release watch
# (.github/workflows/tool-version-watch.yaml).
#
# dependabot owns `uses:` VERSION refs -- tag refs and SHA pins on GitHub
# Actions -- and it does that job well here: 40+ call sites are current.
# It owns them EXCLUSIVELY. Giving one dependency two mechanisms with
# opinions is worse than one that works, so the watch's detector
# deliberately ignores a `uses:` version ref, and no `docker` ecosystem is
# declared below: that updater bumps Dockerfile `FROM` tags, which are
# exactly the pins the watch already reads out of their ARGs.
#
# The watch owns what dependabot provably cannot see or advance: a
# Dockerfile ARG, an IMAGE REFERENCE AT A VERSION TAG WHEREVER IT IS
# WRITTEN (a `FROM`, a compose `image:`, a job `container:`, a `docker
# run`, a justfile recipe, a `sed` that writes any of those into a
# generated file, with or without a namespace), a release-download URL, a
# `git clone -b <tag>`, and a `uses:` ref pinned to a BRANCH (it bumps a
# version ref to the next VERSION, and `main` is not one) -- plus every
# `uses:` ref, version-shaped or not, written OUTSIDE .github/workflows/,
# because a ref in a heredoc a generator writes is not a workflow file
# and neither this repo's updater nor the generated repo's can advance it.
#
# The list above is a claim about the DETECTOR, not an aspiration: every
# shape named here is a case in script/watch/lib.sh with a unit spec
# behind it. This paragraph has twice been WIDER than the detector -- it
# claimed the release-download URL while the detector was blind to it,
# then claimed "an image named inside a `run:` step (with or without a
# namespace)" while a namespace-less one was only ever seen next to a
# `docker` verb. Both times the sentence was the accurate description of
# the intent and the code was narrower, so the code moved.
#
# Every one of those carries a `tool-pin:` marker at its declaration site,
# and the `pin-coverage` lint fails a PR that adds one without a marker --
# so the boundary cannot silently move by someone adding a pin on either
# side.
#
# One thing dependabot does that nothing else here can: it also stops. A
# CLOSED dependabot PR is never re-raised for that version pair, and no
# line in this file records the opt-out. The watch takes the opposite
# stance on purpose -- it re-proposes until the refusal is written down as
# `skip=<version>` on the marker.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
