name: Merged PR comment

# GitHub never notifies an account about its own actions, and the owner
# merges through the merge queue, so a merge leaves no event addressed to
# the owner. This workflow fires when a pull request into main closes; the
# comment it posts as the bot is the notification (base#2012).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Announce the merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          name="${REPO#*/}"
          # $owner/$name/$number are GraphQL variables, not shell
          # shellcheck disable=SC2016
          # tool-pin: ignore -- a GraphQL query, not a third-party version
          query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){closingIssuesReferences(first:100){nodes{number repository{nameWithOwner}}}}}}'
          answer="$(gh api graphql \
            -F owner="${owner}" -F name="${name}" -F number="${PR}" \
            -f query="${query}")"
          refs="$(jq -r --arg repo "${REPO}" '[.data.repository.pullRequest.closingIssuesReferences.nodes[]
            | if .repository.nameWithOwner == $repo then "#\(.number)"
              else "\(.repository.nameWithOwner)#\(.number)" end] | join(", ")' <<<"${answer}")"
          {
            echo '<!-- merged-pr-comment -->'
            echo "Merged as ${MERGE_SHA}."
            echo "Closes: ${refs}."
          } >"${RUNNER_TEMP:-/tmp}/merged-pr-comment.md"
          gh pr comment "${PR}" --repo "${REPO}" \
            --body-file "${RUNNER_TEMP:-/tmp}/merged-pr-comment.md"
