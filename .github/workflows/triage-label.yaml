name: Triage label

# Safety net for issues that carry no state label. `doc/agents/triage-labels.md`
# says every issue carries exactly one of its state roles, but an issue can
# reach zero two ways: opened with only a kind label (`enhancement`, set by
# the to-issues flow at creation), or its last state label removed later.
# On every open/label/unlabel event this re-reads the issue's labels and, when
# none of them is a state role, applies the intake role so a later maintainer
# sweep can replace it. A kind label alone does not count as a state. When
# `needs-triage` sits beside another state role it is the leftover intake
# role, so it is removed and the other role stays (base#1713).
#
# The label is `needs-triage`, the canonical intake role in
# `doc/agents/triage-labels.md`, and NOT `triage`. This line said `triage`
# for long enough to matter: the tracker migration renamed that label in
# place to `needs-triage`, and `addLabels` CREATES a label the repo does
# not have -- so every unlabeled issue reaching here silently minted the
# retired name again, on GitHub's default grey, with no description and
# outside the vocabulary. Deleting the label by hand does not hold while
# this line disagrees with the doc, which is why
# `test/bats/unit/triage_label_yaml_spec.bats` derives the allowed set
# from that doc's own table and fails on anything outside it (base#1182).
#
# Zero ongoing maintenance: no keyword/path ruleset to keep current.

on:
  issues:
    # A label set changes on three events: opening, adding and removing.
    # `opened` alone never saw a state label being taken off (base#1713).
    types: [opened, labeled, unlabeled]

# One labeller per issue. Two runs for the same issue -- a re-delivered
# webhook, a re-run -- would both see the same label set and both add
# the label; serialising makes the second run start after the first
# finished. Never cancelled: the run IS the labelling, and a cancelled
# one leaves the issue untriaged with nothing to retry it.
concurrency:
  group: triage-label-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    # Every job in the tree bounds itself; GitHub's default is six hours.
    # This one reads the issue's labels and makes at most one edit.
    timeout-minutes: 5
    # The job refuses only a closed issue. Which labels count as a state is
    # not a job-level question: a kind label alone (`enhancement`) used to
    # skip the job here and leave the issue stateless (base#1713).
    if: github.event.issue.state == 'open'
    steps:
      # The labels are re-read at run time, never taken from the event
      # payload, and a failed read fails the step: an API error is never
      # read as "no state label" (base#1713).
      - name: Add or remove needs-triage by state label count
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          states=(needs-triage needs-info ready-for-agent ready-for-human wontfix needs-decision)
          current="$(gh api --paginate "repos/${REPO}/issues/${ISSUE}/labels")"
          names="$(jq -r '.[].name' <<< "${current}")"
          count=0
          for state in "${states[@]}"; do
            if grep -qxF -- "${state}" <<< "${names}"; then
              count=$((count + 1))
            fi
          done
          if (( count == 0 )); then
            gh issue edit "${ISSUE}" --repo "${REPO}" --add-label needs-triage
          elif (( count > 1 )) && grep -qxF -- needs-triage <<< "${names}"; then
            gh issue edit "${ISSUE}" --repo "${REPO}" --remove-label needs-triage
          else
            printf 'issue #%s carries %d state label(s); nothing to change\n' "${ISSUE}" "${count}"
          fi
