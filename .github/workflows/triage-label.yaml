name: Triage label

# Safety net for externally-filed, unlabeled issues. The maintainer and
# the to-issues flow already set real area/type labels at issue creation,
# so the only issues reaching this workflow with zero labels are ones
# opened without any label at all. For those, apply the intake state role
# so a later maintainer sweep can replace it with the right label. Issues
# that already carry a label are left untouched.
#
# The label is `needs-triage`, the canonical intake role in
# `doc/agents/triage-labels.md`, and NOT `triage`. This line said `triage`
# for long enough to matter: the tracker migration renamed that label in
# place to `needs-triage`, and `addLabels` CREATES a label the repo does
# not have -- so every unlabeled issue reaching here silently minted the
# retired name again, on GitHub's default grey, with no description and
# outside the vocabulary. Deleting the label by hand does not hold while
# this line disagrees with the doc, which is why
# `test/bats/unit/triage_label_yaml_spec.bats` derives the allowed set
# from that doc's own table and fails on anything outside it (base#1182).
#
# Zero ongoing maintenance: no keyword/path ruleset to keep current.

on:
  issues:
    types: [opened]

# One labeller per issue. Two runs for the same issue -- a re-delivered
# webhook, a re-run -- would both read `labels[0] == null` from the same
# payload and both add the label; serialising makes the second read the
# state the first left. Never cancelled: the run IS the labelling, and a
# cancelled one leaves the issue untriaged with nothing to retry it.
concurrency:
  group: triage-label-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    # Every job in the tree bounds itself; GitHub's default is six hours.
    # This one adds a label through the API and nothing else.
    timeout-minutes: 5
    # Only act when the issue was opened without any label.
    if: github.event.issue.labels[0] == null
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-triage'],
            })
