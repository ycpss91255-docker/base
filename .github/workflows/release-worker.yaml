name: Release

on:
  workflow_call:
    inputs:
      archive_name_prefix:
        required: true
        type: string
        description: "Archive name prefix (e.g. ros_noetic)"
      extra_files:
        required: false
        type: string
        default: ""
        description: "Space-separated list of extra files/dirs to include in archive"

jobs:
  # ────────────────────────────────────────────────────────────────
  # #800 — caller-contract preflight. Same self-validation the build
  # worker runs: a caller that forgot a required input fails within
  # seconds with a plain-language fix, before any archive work. The
  # declared requirement list is script/ci/preflight/release.manifest,
  # validated by script/ci/preflight.sh — both fetched from base at the
  # SAME ref as this workflow (github.job_workflow_sha) so the validator
  # never drifts from the worker. The logic is tested under `just test`.
  # ────────────────────────────────────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout base worker source (version-matched via job_workflow_sha)
        uses: actions/checkout@v7
        with:
          repository: ycpss91255-docker/base
          ref: ${{ github.job_workflow_sha }}
          path: .preflight-base
      - name: Validate caller contract (preflight)
        env:
          PREFLIGHT_INPUT_ARCHIVE_NAME_PREFIX: ${{ inputs.archive_name_prefix }}
        run: bash .preflight-base/script/ci/preflight.sh .preflight-base/script/ci/preflight/release.manifest

  release:
    needs: [preflight]
    runs-on: ubuntu-latest
    # softprops/action-gh-release creates a Release, which needs
    # `contents: write`. Declared rather than inherited: the caller's
    # `call-release` job grants exactly this (init.sh seeds it), so the
    # ceiling is unchanged and every other scope the caller may hold --
    # `packages: write` on a repo that also publishes -- stops here
    # (#957).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The archive payload is DECLARED (script/ci/release/archive.manifest)
      # and assembled by script/ci/release-archive.sh, both fetched from base
      # at the SAME ref as this workflow (github.job_workflow_sha) so the
      # assembler never drifts from the worker — exactly as the preflight job
      # above fetches its validator. The logic is tested under `just test`;
      # this step is the wiring only.
      - name: Checkout base worker source (version-matched via job_workflow_sha)
        uses: actions/checkout@v7
        with:
          repository: ycpss91255-docker/base
          ref: ${{ github.job_workflow_sha }}
          path: .release-base

      - name: Create release archive
        env:
          ARCHIVE_NAME_PREFIX: ${{ inputs.archive_name_prefix }}
          RELEASE_EXTRA_FILES: ${{ inputs.extra_files }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="${ARCHIVE_NAME_PREFIX}-${VERSION}"

          bash .release-base/script/ci/release-archive.sh \
            .release-base/script/ci/release/archive.manifest \
            "${ARCHIVE_NAME}"

          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          zip -r  "${ARCHIVE_NAME}.zip"    "${ARCHIVE_NAME}"

      # Whether this tag is a prerelease is asked of the one classifier
      # that owns the rule, checked out with the rest of the worker source
      # at the SAME ref as this workflow. It used to be an inline
      # `contains(github.ref_name, '-')` here and a second copy of the
      # same expression in self-test.yaml, with a third site
      # (release-test-tools.yaml) deciding the org's `test-tools:latest`
      # without asking at all. The classifier also REFUSES a tag it cannot
      # read as a version instead of calling it final, so a malformed tag
      # fails the release rather than publishing a mislabelled one.
      - name: Classify the release ref
        id: ref
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease="$(bash .release-base/script/ci/release-ref.sh \
              prerelease "${REF}")"
          printf 'prerelease=%s\n' "${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease} (ref=${REF})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: doc/changelog/CHANGELOG.md
          generate_release_notes: true
          prerelease: ${{ steps.ref.outputs.prerelease }}
          files: |
            ${{ inputs.archive_name_prefix }}-*.tar.gz
            ${{ inputs.archive_name_prefix }}-*.zip
