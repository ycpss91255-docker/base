name: Release test-tools image to GHCR

# Multi-arch (linux/amd64 + linux/arm64) build of
# dockerfile/Dockerfile.test-tools, pushed to
# ghcr.io/ycpss91255-docker/test-tools tagged with the release version
# and :latest. Downstream repo Dockerfiles consume this via
# `ARG TEST_TOOLS_IMAGE=ghcr.io/ycpss91255-docker/test-tools:<ver>`,
# avoiding the cross-step image-store isolation that sank the previous
# `test-tools:local` approach (v0.9.11 pre-D migration).
#
# Triggers:
#   push of a vX.Y.Z tag -> pushes :<tag> and :latest
#   push to main (Dockerfile.test-tools or this workflow changed)
#                        -> pushes :main rolling tag (#317 P2)
#   workflow_dispatch    -> manual bootstrap; pushes only :latest
#
# Why the paths filter on main push: every non-doc PR merge triggers
# a push to main, but most don't touch Dockerfile.test-tools. Without
# the filter, every merge would burn build minutes republishing the same
# image content under a new manifest digest. Restrict the main trigger to
# commits that actually change the test-tools recipe; tag-push trigger
# stays unfiltered because tag pushes are explicit publish intents.
#
# Multi-arch build model (#587): each architecture builds on its NATIVE
# runner (linux/amd64 -> ubuntu-latest, linux/arm64 -> ubuntu-24.04-arm),
# consistent with build-worker / publish-worker. Because the
# arches build on separate runners, each shard pushes its single-arch
# image BY DIGEST (no tag), then a `merge` job assembles the tagged
# multi-arch manifest list from the digests via
# `docker buildx imagetools create`. This is deliberate: having each
# shard push the SAME tag would leave a last-shard-wins single-arch tag
# (the latent failure mode), which would break the downstream
# `FROM ${TEST_TOOLS_IMAGE}` consumers on the losing arch.
#
# Needs packages: write to push to GHCR under the org namespace.

on:
  push:
    branches: [main]
    paths:
      - 'dockerfile/Dockerfile.test-tools'
      - '.github/workflows/release-test-tools.yaml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ycpss91255-docker/test-tools

jobs:
  # Parse the target platforms into a native-runner matrix, mirroring
  # build-worker.yaml / publish-worker.yaml's compute-matrix convention.
  # The platform list is fixed here (this is a fixed multi-arch
  # publisher with no `platforms` input); factoring the parser into a
  # single source shared across all three workflows is a follow-up.
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          PLATFORMS: "linux/amd64,linux/arm64"
        run: |
          set -euo pipefail
          items=""
          IFS=',' read -ra plats <<< "${PLATFORMS}"
          for p in "${plats[@]}"; do
            p="${p//[[:space:]]/}"
            case "${p}" in
              linux/amd64)
                items+='{"platform":"linux/amd64","runner":"ubuntu-latest","hardware":"amd64"},'
                ;;
              linux/arm64)
                items+='{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","hardware":"arm64"},'
                ;;
              "")
                continue
                ;;
              *)
                echo "::error::Unsupported platform '${p}'. Supported: linux/amd64, linux/arm64"
                exit 1
                ;;
            esac
          done
          if [ -z "${items}" ]; then
            echo "::error::No valid platforms found in '${PLATFORMS}'"
            exit 1
          fi
          echo "matrix={\"include\":[${items%,}]}" >> "${GITHUB_OUTPUT}"

  # Per-platform build on the native runner. Each shard pushes its
  # single-arch image BY DIGEST (no tag); the merge job assembles the
  # tagged manifest list from the digests.
  build:
    needs: compute-matrix
    # Same-repository guard (see build-worker.yaml's `build` job for the
    # full rationale). `runs-on` is a runtime-computed matrix label, so the
    # job is self-hosted-eligible by the static rule and must carry it.
    # Operationally inert today: this workflow has no `pull_request`
    # trigger at all, so the first disjunct is always true. It is here so
    # that adding one later cannot open the hole silently. Enforced by the
    # self-hosted-guard lint.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        # This workflow runs inside the template repo, not a downstream
        # consumer, so the Dockerfile lives at `dockerfile/...`, not
        # `.base/dockerfile/...` (the latter is only the subtree path
        # downstream repos see).
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile/Dockerfile.test-tools
          platforms: ${{ matrix.platform }}
          # Push by digest only (no tag); the merge job applies the tags
          # to a manifest list assembled from every arch's digest.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.hardware }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the tagged multi-arch manifest from the per-arch digests,
  # then smoke-test the published tag.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The smoke step below compares three of the image's tools against
      # the checkout that built it, so this job needs the tree -- it
      # previously needed none. shellcheck and hadolint are read out of the
      # release URLs dockerfile/Dockerfile.test-tools pins; `just` is read
      # out of ARG JUST_VERSION through dist/script/base/just-version.sh.
      # Deriving all three from the declaration is the whole point: a
      # version literal in this workflow would be a second place to forget,
      # and two literals that agree with each other prove only that someone
      # edited both.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        shell: bash
        # Three publish modes, three tag sets. `smoke` is the single tag
        # the post-publish smoke step pulls so we always exercise the
        # image we just pushed (rather than statically pulling :latest
        # and missing :main bootstrapping bugs).
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF##refs/tags/}"
            tags="${IMAGE}:${ver},${IMAGE}:latest"
            smoke="${IMAGE}:${ver}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags="${IMAGE}:main"
            smoke="${IMAGE}:main"
          else
            tags="${IMAGE}:latest"
            smoke="${IMAGE}:latest"
          fi
          printf 'tags=%s\n' "${tags}" >> "${GITHUB_OUTPUT}"
          printf 'smoke=%s\n' "${smoke}" >> "${GITHUB_OUTPUT}"
          echo "Computed tags: ${tags}"

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        shell: bash
        # Build `-t <tag>` flags from the comma-separated tag list and
        # source refs from each per-arch digest filename, then create the
        # manifest list. This is what makes the published tag a true
        # multi-arch image instead of a last-shard-wins single arch.
        run: |
          set -euo pipefail
          tag_args=()
          IFS=',' read -ra _tags <<< "${{ steps.tags.outputs.tags }}"
          for _t in "${_tags[@]}"; do
            tag_args+=("-t" "${_t}")
          done
          src=()
          for _d in *; do
            src+=("${IMAGE}@sha256:${_d}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${src[@]}"

      - name: Smoke test pushed image
        # Regression guard for the v0.12.1 publish (issue #165): the alpine
        # final stage shipped without bash and without /usr/local/bin/bats,
        # so the image had bats-* files on disk but `bats` was unrunnable.
        # Pull the just-pushed manifest and exercise each tool end-to-end
        # so a similar break never reaches downstream consumers silently.
        # The smoke target tracks `steps.tags.outputs.smoke` so we always
        # verify the image the current trigger produced (incl. :main on
        # main push, not the stale :latest left from the previous tag).
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.tags.outputs.smoke }}"
          docker pull "${image}"
          docker run --rm "${image}" bats --version

          # The two lint gates every PR in this repo must pass are the
          # static-analysis pair pinned by literal release URL in
          # dockerfile/Dockerfile.test-tools -- a shape dependabot cannot
          # see. `<tool> --version` asserting exit 0, which is what stood
          # here, catches a tool that vanished from the image and nothing
          # else: a hadolint pin went 3.8 years stale behind this very
          # check. So read the pin and compare it with what the image
          # actually shipped.
          #
          # The expectations are GREPPED from the Dockerfile rather than
          # written here. An empty grep result is a hard failure, never an
          # empty-string comparison that agrees with itself: that is the
          # state a moved URL or a renamed file produces, and it is exactly
          # when a silent pass is worst.
          df="dockerfile/Dockerfile.test-tools"
          expected_sc="$(sed -n 's|.*shellcheck/releases/download/v\([0-9][0-9.]*\)/.*|\1|p' "${df}" | head -n1)"
          expected_hd="$(sed -n 's|.*hadolint/releases/download/v\([0-9][0-9.]*\)/.*|\1|p' "${df}" | head -n1)"
          if [[ -z "${expected_sc}" || -z "${expected_hd}" ]]; then
            echo "could not read the shellcheck / hadolint pins from ${df} (shellcheck='${expected_sc}' hadolint='${expected_hd}'). The release URL moved, or the file did. Refusing to report agreement between two empty strings." >&2
            exit 1
          fi

          # Both tools print their version as a bare number; the pins are
          # tags, hence the stripped leading v above. The dots are escaped
          # and the number is bounded on both sides, so 0.11.0 matches the
          # version it is and not 0.11.01, nor a digit sequence that merely
          # contains it.
          re_sc="${expected_sc//./\\.}"
          re_hd="${expected_hd//./\\.}"
          actual_sc="$(docker run --rm "${image}" shellcheck --version)"
          if ! grep -qE "(^|[^0-9.])${re_sc}([^0-9.]|$)" <<< "${actual_sc}"; then
            echo "shellcheck version mismatch: ${df} pins v${expected_sc}, image reports:" >&2
            echo "${actual_sc}" >&2
            exit 1
          fi
          echo "shellcheck: pinned v${expected_sc}, image agrees"

          actual_hd="$(docker run --rm "${image}" hadolint --version)"
          if ! grep -qE "(^|[^0-9.])${re_hd}([^0-9.]|$)" <<< "${actual_hd}"; then
            echo "hadolint version mismatch: ${df} pins v${expected_hd}, image reports:" >&2
            echo "${actual_hd}" >&2
            exit 1
          fi
          echo "hadolint: pinned v${expected_hd}, image agrees"
          docker run --rm "${image}" parallel --version
          docker run --rm "${image}" git --version
          # just (#546, #948): the justfile entry point replaces the
          # Makefile; downstream + CI run `just <verb>` (the single
          # runner, make is retired), so the image must carry it -- at the
          # PINNED version. Every other check in this step asserts exit 0,
          # which catches a tool's removal and never its staleness; that
          # is precisely how this image sat 37 minors behind the `just`
          # CI and developer hosts ran, green throughout. So compare the
          # version string against the declaration the image was built
          # from.
          just_pin="$(./dist/script/base/just-version.sh)"
          just_actual="$(docker run --rm "${image}" just --version)"
          if [ "${just_actual}" != "just ${just_pin}" ]; then
            echo "::error::${image} ships '${just_actual}' but dockerfile/Dockerfile.test-tools declares ARG JUST_VERSION=${just_pin}" >&2
            exit 1
          fi
          echo "just ${just_pin} confirmed in ${image}"
          # `git subtree --help` would invoke `man git-subtree`, but alpine
          # ships no man viewer in the test-tools image (and we don't want
          # to install one just for this smoke check). Confirm the binary
          # exists at git's exec-path instead — same regression-detection
          # value, no man dependency.
          docker run --rm "${image}" sh -c 'test -f "$(git --exec-path)/git-subtree"'
          # docker-cli + docker-cli-buildx (#249): consumed by the
          # system test suite (test/bats/system/*.bats) when run
          # via the ci-system compose service. Smoke-check both
          # by version. buildx is exposed as `docker buildx version`,
          # not a standalone binary.
          docker run --rm "${image}" docker --version
          docker run --rm "${image}" docker buildx version
          # docker-cli-compose + xz: the field-deploy system test runs the
          # generated deploy.sh (real `docker compose up -d`) and unxz's the
          # bundled image.tar.xz; the generator xz-compresses the saved image.
          docker run --rm "${image}" docker compose version
          docker run --rm "${image}" xz --version
          # mawk + gawk (#576): added alongside busybox awk so the issueref
          # awk program's portability unit test exercises all three engines
          # in the alpine `just test` loop (closes the kcov debian/mawk
          # blind spot). mawk reports its version on stderr and exits non-
          # zero for -W version, so probe presence via the binary path.
          docker run --rm "${image}" sh -c 'command -v mawk'
          docker run --rm "${image}" gawk --version
          # yq (#957): the spec suite's YAML derivations query a parser
          # rather than matching indentation with awk, so a job or a
          # permission entry written in a shape the regex did not model
          # can no longer go missing. Alpine ships it as `yq-go`; the
          # binary on PATH is `yq`, which is what this probe pins.
          docker run --rm "${image}" yq --version
          # kcov (#686): source-built into the image (not in any alpine
          # repo) so the coverage matrix runs on this one shared image
          # instead of the old debian kcov/kcov + per-shard apt-install.
          # Smoke-check the binary loads (its runtime shared libs are
          # apk-installed in the final stage); --version exits 0.
          docker run --rm "${image}" kcov --version
